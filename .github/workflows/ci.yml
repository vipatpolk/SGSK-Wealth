name: SGSK-Wealth Monorepo CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  security-scan:
    name: Security Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  backend-qa:
    name: Backend QA (Ruff, Mypy & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-dev.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Mypy Type Checker
        run: mypy .

      - name: Run Pytest Unit Tests with Coverage
        run: pytest --cov=. --cov-report=xml --cov-report=term-missing

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml
          retention-days: 7

  frontend-qa:
    name: Web Frontend QA (Vitest & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Web Unit Tests
        run: npm run test:web

      - name: Build Web Production Bundle
        run: npm run build:web

  mobile-qa:
    name: Mobile App QA (Ionic Vitest & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 26 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Run Mobile Unit Tests
        run: npm run test:mobile

      - name: Build Mobile Production Bundle
        run: npm run build:mobile

  e2e-automation:
    name: End-to-End Automation (Java, Playwright, Appium, Rest Assured & Allure)
    needs: [backend-qa, frontend-qa, mobile-qa]
    runs-on: ubuntu-latest
    outputs:
      report_generated: ${{ steps.allure_gen.outputs.generated }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 26 LTS (for Web & Mobile Dev Servers)
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Workspace Dependencies
        run: npm ci

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Playwright Browsers
        run: mvn -f e2e/pom.xml exec:java -Dexec.classpathScope=test -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Execute Unified E2E Test Suite
        run: mvn -f e2e/pom.xml clean test

      - name: Restore Allure History Cache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: e2e/target/allure-history-cache
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.base_ref || github.ref_name }}-
            allure-history-main-

      - name: Restore Allure History Fallback (Artifact API)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/allure-ci-helper.mjs restore-history-from-artifact

      - name: Prepare Allure Metadata & History
        if: always()
        run: |
          if [ -d "e2e/target/allure-results" ]; then
            node .github/scripts/allure-ci-helper.mjs prepare-results
          fi

      - name: Generate Allure Report
        id: allure_gen
        if: always()
        run: |
          if [ -d "e2e/target/allure-results" ]; then
            mvn -f e2e/pom.xml allure:report
            node .github/scripts/allure-ci-helper.mjs finalize-report
            node .github/scripts/allure-ci-helper.mjs step-summary
            echo "generated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Allure results directory found; skipping report generation."
            echo "generated=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Allure Report Artifact
        if: always() && steps.allure_gen.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-e2e-report
          path: e2e/target/site/allure-maven-plugin/
          retention-days: 30

      - name: Save Allure History Cache
        if: always() && steps.allure_gen.outputs.generated == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v4
        with:
          path: e2e/target/allure-history-cache
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload GitHub Pages Artifact
        if: always() && steps.allure_gen.outputs.generated == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v3
        with:
          path: e2e/target/site/allure-maven-plugin/

  publish-allure-report:
    name: Publish Allure Report to GitHub Pages
    needs: [e2e-automation]
    if: always() && needs.e2e-automation.outputs.report_generated == 'true' && needs.e2e-automation.result != 'cancelled' && needs.e2e-automation.result != 'skipped' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
