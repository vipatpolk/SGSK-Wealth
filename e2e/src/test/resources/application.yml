spring:
  main:
    web-application-type: none
    banner-mode: off

e2e:
  target: ${E2E_TARGET:api}
  frontend:
    base-url: ${E2E_BASE_URL:http://127.0.0.1:4200}
  backend:
    base-url: ${E2E_BACKEND_URL:}
    default-url: http://127.0.0.1:8000
    port: 8000
    api-key: ${E2E_API_KEY:dev_secret_key_change_in_prod}
  playwright:
    headless: ${HEADLESS:true}
  supabase:
    url: ${E2E_SUPABASE_URL:https://jjdnxifgpbdvntfwhyzz.supabase.co}
  mobile:
    appium-url: ${E2E_APPIUM_URL:http://127.0.0.1:4723}
    platform: ${E2E_MOBILE_PLATFORM:ANDROID}
    device-name: ${E2E_MOBILE_DEVICE:Pixel_8_API_35}
    platform-version: ${E2E_MOBILE_OS_VERSION:15}
    app-path: ${E2E_MOBILE_APP_PATH:}
    app-package: ${E2E_MOBILE_APP_PACKAGE:com.sgsk.wealth.mobile}
    app-activity: ${E2E_MOBILE_APP_ACTIVITY:.MainActivity}
    bundle-id: ${E2E_MOBILE_BUNDLE_ID:com.sgsk.wealth.mobile}
    base-url: ${E2E_MOBILE_BASE_URL:http://127.0.0.1:4201}
    auto-webview: ${E2E_MOBILE_AUTO_WEBVIEW:true}
    fallback-to-local-webview: ${E2E_MOBILE_FALLBACK_WEBVIEW:true}
