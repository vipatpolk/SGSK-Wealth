<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand background gradient: Ocean Blue to Cyan -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1661D8" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    
    <!-- Shield fill gradient: Semi-transparent white crest glow -->
    <linearGradient id="crestFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Outer squircle shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1661D8" flood-opacity="0.45" />
    </filter>

    <!-- Checkmark shadow for crisp legibility at small sizes -->
    <filter id="checkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#09387a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle with shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#glow)" />

  <!-- Subtle inner border highlight -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Shield Crest & Checkmark Logo Mark (Center aligned) -->
  <g transform="translate(100, 86) scale(13)">
    <!-- Protective Shield Crest -->
    <path
      d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"
      fill="url(#crestFill)"
      stroke="rgba(255, 255, 255, 0.45)"
      stroke-width="1.6"
      stroke-linejoin="round"
    />
    <!-- Verified Accounting Checkmark -->
    <path
      d="M8 12.5l2.8 2.8 5.2-5.3"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#checkGlow)"
    />
  </g>
</svg>
