<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="lotGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="lotGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="lotGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background rounded squircle with shadow -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle inner border highlight -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" />

  <!-- FIFO Share Lot Stacked Bars -->
  <!-- Lot Tier 1 (First In) -->
  <rect x="96" y="320" width="80" height="96" rx="16" fill="url(#lotGrad1)" />
  <!-- Lot Tier 2 -->
  <rect x="196" y="240" width="80" height="176" rx="16" fill="url(#lotGrad2)" />
  <!-- Lot Tier 3 -->
  <rect x="296" y="160" width="80" height="256" rx="16" fill="url(#lotGrad3)" />

  <!-- Horizontal FIFO Lot Divider Lines (representing share lots) -->
  <line x1="96" y1="368" x2="176" y2="368" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round" />
  <line x1="196" y1="328" x2="276" y2="328" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round" />
  <line x1="296" y1="288" x2="376" y2="288" stroke="rgba(255,255,255,0.35)" stroke-width="4" stroke-linecap="round" />

  <!-- Dynamic Trend & Arrow Line -->
  <path d="M 88 330 L 190 230 L 275 285 L 400 135" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)" />
  <path d="M 310 135 L 400 135 L 400 225" fill="none" stroke="#ffffff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" filter="url(#lineGlow)" />
</svg>
