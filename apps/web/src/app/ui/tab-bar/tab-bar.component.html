@if (currentView() === 'holdings') {
<ng-template #tabIconTpl let-icon let-isActive="active">
  <app-nav-icon
    [name]="resolveTabIconName(icon)"
    [active]="!!isActive"
    class="tab-icon"
  ></app-nav-icon>
</ng-template>

<nav class="tab-bar" id="tab-bar">
  <div class="symbol-selector-wrapper tab-dropdown-wrapper" [class.dropdown-is-open]="isTabDropdownOpen()">
    <button
      class="symbol-selector-btn tab-dropdown-btn"
      (click)="toggleDropdown.emit()"
      id="tab-dropdown-btn"
      type="button"
    >
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <ng-container *ngTemplateOutlet="tabIconTpl; context: { $implicit: activeTab().icon, active: true }"></ng-container>
        <span class="symbol-selector-text">{{ getTabLabel(activeTab()) }}</span>
      </div>
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="chevron-arrow" [class.chevron-open]="isTabDropdownOpen()">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    @if (isTabDropdownOpen()) {
      <div class="symbol-dropdown-menu tab-dropdown-menu">
        <div class="dropdown-list">
          @for (tab of tabs(); track tab.id) {
            <button
              class="dropdown-item"
              [class.active]="activeTab().id === tab.id"
              (click)="tabSelect.emit(tab)"
              type="button"
            >
              <ng-container *ngTemplateOutlet="tabIconTpl; context: { $implicit: tab.icon, active: activeTab().id === tab.id }"></ng-container>
              <span>{{ getTabLabel(tab) }}</span>
              @if (tabCounts()[tab.id] !== undefined && tabCounts()[tab.id] > 0) {
                <span class="tab-count-pill">{{ tabCounts()[tab.id] }}</span>
              }
            </button>
          }
        </div>
      </div>
      <div class="dropdown-backdrop" (click)="toggleDropdown.emit()"></div>
    }
  </div>
  <div class="tab-bar-inner">
    @for (tab of tabs(); track tab.id) {
      <button
        class="tab-button"
        [class.tab-active]="activeTab().id === tab.id"
        (click)="tabSelect.emit(tab)"
        [id]="'tab-' + tab.id"
      >
        <ng-container *ngTemplateOutlet="tabIconTpl; context: { $implicit: tab.icon, active: activeTab().id === tab.id }"></ng-container>
        <span class="tab-label">{{ getTabLabel(tab) }}</span>
        @if (tabCounts()[tab.id] !== undefined && tabCounts()[tab.id] > 0) {
          <span class="tab-count-pill">{{ tabCounts()[tab.id] }}</span>
        }
      </button>
    }
  </div>
</nav>
}
