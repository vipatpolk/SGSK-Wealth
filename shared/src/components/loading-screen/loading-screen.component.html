<div
  class="loader-stage"
  [class.loader-stage-fullscreen]="variant() === 'fullscreen'"
  [class.loader-stage-inline]="variant() === 'inline'"
  [attr.id]="variant() === 'fullscreen' ? 'loading-state' : null"
  [attr.aria-label]="title() || 'Loading'"
  role="status"
  aria-live="polite"
>
  @if (variant() === 'fullscreen') {
    <div class="loader-ambient-mesh" aria-hidden="true"></div>
    <div class="loader-grid-overlay" aria-hidden="true"></div>
  }

  <div
    class="loader-emblem"
    [class.loader-emblem-sm]="variant() === 'inline'"
    aria-hidden="true"
  >
    <div class="loader-halo"></div>
    <div class="loader-orbit">
      <div class="loader-orbit-ring loader-orbit-outer"></div>
      <div class="loader-orbit-ring loader-orbit-inner"></div>
    </div>
    <div class="loader-logo-shell">
      <img
        src="brand-logo.png"
        alt="SGSK Wealth"
        class="loader-brand-logo"
      />
    </div>
  </div>
</div>
