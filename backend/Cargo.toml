[package]
name = "sgsk-backend"
version = "0.1.0"
edition = "2021"
description = "SGSK-Wealth Backend Service in Rust (Axum + Tokio)"

[lib]
name = "sgsk_backend"
path = "src/lib.rs"

[[bin]]
name = "sgsk-backend"
path = "src/main.rs"

[[bin]]
name = "index"
path = "api/index.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "set-header"] }
http = "1"
vercel_runtime = { version = "2", features = ["axum"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

csv = "1.3"
encoding_rs = "0.8"
regex = "1"
url = "2"
urlencoding = "2"
html-escape = "0.2"

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
wiremock = "0.6"
approx = "0.5"
http-body-util = "0.1"
rsa = { version = "0.9", features = ["pem", "sha2"] }
rand = "0.8"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
